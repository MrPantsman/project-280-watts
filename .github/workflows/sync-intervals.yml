name: Sync Intervals

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour; GitHub may run it a little late
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: sync-intervals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A push made with the built-in GITHUB_TOKEN does NOT trigger a GitHub Pages build,
      # so the checkout (and therefore the push) uses your own token from the GH_PAT secret.
      - name: Check secrets
        env:
          PAT: ${{ secrets.GH_PAT }}
          KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Secret INTERVALS_API_KEY is missing"; exit 1; }
          [ -n "$PAT" ] || { echo "::error::Secret GH_PAT is missing (needed so the Pages site rebuilds)"; exit 1; }

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Fetch from Intervals
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python3 scripts/sync_intervals.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/intervals.json)" ]; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "intervals-sync"
          git config user.email "intervals-sync@users.noreply.github.com"
          git add data/intervals.json
          git commit -m "Update Intervals data"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          echo "::error::Could not push after 3 tries"
          exit 1
