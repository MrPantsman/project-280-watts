<style>

</style></head><body><main>
<div class="muted" style="font-size:12px;letter-spacing:.05em">PROJECT 270 · CYCLING NUTRITION</div>
<h1>Fuel <span style="font-size:13px;color:var(--muted);font-weight:400">V25 · plan vs actual, food from Intervals</span></h1>
<p class="note" id="status">Loading data…</p>
<nav class="nav" id="nav">
<button class="tab" data-p="today" aria-selected="true">Today</button><button class="tab" data-p="week" aria-selected="false">Week</button><button class="tab" data-p="review" aria-selected="false">Review</button><button class="tab" data-p="trend" aria-selected="false">Trend</button><button class="tab" data-p="settings" aria-selected="false">Settings</button></nav>
<div class="page" id="p-today"></div><div class="page" id="p-week" hidden></div><div class="page" id="p-review" hidden></div><div class="page" id="p-trend" hidden></div><div class="page" id="p-settings" hidden></div>
<p class="note" id="err" style="color:var(--red)"></p>
</main>
<script>
'use strict';
/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok=x=>x!=null&&isFinite(x);
const N0=x=>ok(x)?Math.round(x).toLocaleString():'—';
const N1=x=>ok(x)?x.toFixed(1):'—';
const N2=x=>ok(x)?x.toFixed(2):'—';
const SG=(x,d=0)=>ok(x)?(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d):'—';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const r5=x=>Math.round(x/5)*5;
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return dk(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const dayLabel=k=>parse(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
let TODAY=dk(new Date());

/* ============ settings ============ */
const SKEY='p280v24_settings',EKEY='p280v24_excl',PKEY='p280v24_snap';
const DEF={baseline:1850,offset:0,resting:1650,ge:23,strength:125,protein:2.0,fatMin:0.7,fatPct:20,restCarb:2.0,recAdd:0.5,prepAdd:0.5,rate:0.15,eaFloor:25,bfDefault:24,capRest:350,capEasy:250,capMod:150,capKey:300,logRide:1,smooth:1};
const CFG=[
 ['baseline','Non-exercise baseline (kcal/day)',1200,3500,25,'Everything except exercise: resting rate, daily movement, digestion. Your 14-day data suggested roughly 1,950; calibrate on the Trend tab.'],
 ['offset','Logged-kcal offset (kcal/day)',-500,800,5,'Added to modelled maintenance so targets are in the same units as your food log. Set it from the Trend tab once calibration is ready.'],
 ['resting','Resting energy (kcal/day)',1000,2500,25,'Subtracted during rides so exercise energy is net, not double-counted.'],
 ['ge','Gross efficiency (%)',20,26,.5,'Converts power-meter kJ to calories (23% ≈ 1 kJ ≈ 1.04 kcal).'],
 ['strength','Strength session (net kcal per 30 min)',0,500,5,'Scaled by recorded duration.'],
 ['protein','Protein (g/kg/day)',1.2,2.6,.1,'1.6–2.0 is the usual athlete range; use the upper end while in a deficit.'],
 ['fatMin','Minimum fat (g/kg/day)',.4,1.5,.05,'A floor, not a target.'],
 ['fatPct','Minimum fat (% of energy)',10,35,1,'Joint ACSM/dietitians position: 20–35% of energy; going below 20% is not shown to help performance. The higher of this and the g/kg floor applies.'],
 ['restCarb','Rest-day carbohydrate (g/kg)',1,4,.25,'Base before recovery/preparation additions.'],
 ['recAdd','Recovery addition (g/kg)',0,1,.25,'Added on easy/rest days after a long or long-hard session.'],
 ['prepAdd','Preparation addition (g/kg)',0,1,.25,'Added the day before a key or long session.'],
 ['rate','Target weight loss (kg/week)',0,.5,.05,'0 = maintain. 0.1–0.25 kg/week keeps well inside slow-loss territory.'],
 ['eaFloor','Energy availability floor (kcal/kg FFM)',15,40,1,'Watch-line only. 30 comes from studies in women; male thresholds are not established.'],
 ['bfDefault','Body fat fallback (%)',8,40,.5,'Used if no recent smart-scale body-fat values.'],
 ['capRest','Max deficit: rest day (kcal)',0,800,25,''],
 ['capEasy','Max deficit: easy/light day (kcal)',0,600,25,''],
 ['capMod','Max deficit: tempo day (kcal)',0,400,25,''],
 ['capKey','Max deficit: key or long day (kcal)',0,600,25,'Taken from fat only, never from the carbohydrate the session needs. Set 0 to protect hard days completely.']
];
const LKEY='p280v24_local';
let SHARED={},LOCAL={},SET=Object.assign({},DEF),SHARED_STATE='not checked yet';
const numOnly=o=>{const r={};if(o&&typeof o==='object')for(const k in DEF)if(typeof o[k]==='number'&&isFinite(o[k]))r[k]=o[k];return r};
function applySettings(){SET=Object.assign({},DEF,SHARED,LOCAL)}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(LOCAL))}catch(e){}}
try{const l=localStorage.getItem(LKEY);if(l!=null)LOCAL=numOnly(JSON.parse(l));else{const old=numOnly(JSON.parse(localStorage.getItem('p280v24_settings')||'{}'));for(const k in old)if(old[k]!==DEF[k])LOCAL[k]=old[k]}}catch(e){}
applySettings();
function setSetting(k,v){const base=Object.assign({},DEF,SHARED)[k];if(v===base)delete LOCAL[k];else LOCAL[k]=v;applySettings();saveLocal()}
let EXCL={};try{EXCL=JSON.parse(localStorage.getItem(EKEY)||'{}')||{}}catch(e){}
let TRUST={};try{TRUST=JSON.parse(localStorage.getItem('p280v24_trust')||'{}')||{}}catch(e){}
let SH_EX={},SH_TR={};
let SNAP={};try{SNAP=JSON.parse(localStorage.getItem(PKEY)||'{}')||{}}catch(e){}

/* ============ data ============ */
let RAW={planned:[],completed:[],wellness:[]},HIST={},HEALTH={},IFOOD={},FOOD={},PB={},CB={},W={},WOUT={},BF={},TREND={},TKEYS=[],FTP=255;
const CACHE=new Map();
const group=list=>{const by={};for(const e of list){const k=String(e&&e.start_date_local||'').slice(0,10);if(DATE_RE.test(k))(by[k]=by[k]||[]).push(e)}return by};
function ingestIntervals(raw){
 const planned=Array.isArray(raw)?raw:raw&&Array.isArray(raw.planned)?raw.planned:null;
 if(!planned)throw Error('Intervals file: expected a planned array or {planned, completed, Wellness}.');
 RAW.planned=planned.filter(e=>e&&typeof e==='object');
 RAW.completed=(raw&&Array.isArray(raw.completed)?raw.completed:[]).filter(a=>a&&typeof a==='object');
 const w=raw&&(Array.isArray(raw.Wellness)?raw.Wellness:Array.isArray(raw.wellness)?raw.wellness:[]);
 RAW.wellness=(w||[]).filter(x=>x&&typeof x==='object');
}
function ingestHistory(raw){
 const days=Array.isArray(raw)?raw:raw&&Array.isArray(raw.days)?raw.days:null;
 if(!days)throw Error('History file: expected a days array.');
 const by={};
 for(const r of days){const k=String(r&&r.date||'');if(!DATE_RE.test(k))continue;const kcal=Number(r.calories);if(!(kcal>0))continue;
  by[k]={kcal,carb:Number(r.carbs)||0,protein:Number(r.protein)||0,fat:Number(r.fat)||0,samples:Number(r.calorie_samples)||0,meals:(Array.isArray(r.meals)?r.meals:[]).map(s=>String(s).toLowerCase()),src:'history'}}
 HIST=by;
}
function ingestHealth(raw){
 const rec=Array.isArray(raw)?raw:raw&&Array.isArray(raw.days)?raw.days:raw&&Array.isArray(raw.nutrition)?raw.nutrition:null;
 if(!rec)throw Error('Nutrition file: expected an array of daily records.');
 const by={};
 for(const r of rec){if(!r||!DATE_RE.test(String(r.date||'')))continue;if(r.calories==null||Number(r.calorie_samples)===0)continue;const kcal=Number(r.calories);if(!isFinite(kcal))continue;
  by[r.date]={kcal,carb:Number(r.carbs)||0,protein:Number(r.protein)||0,fat:Number(r.fat)||0,samples:Number(r.calorie_samples)||0,meals:[],src:'health'}}
 HEALTH=by;
}
function rebuild(){
 TODAY=dk(new Date());
 PB=group(RAW.planned);CB=group(RAW.completed);
 W={};BF={};
 for(const w of RAW.wellness){const k=String(w.id||w.date||'').slice(0,10);if(!DATE_RE.test(k))continue;const v=Number(w.weight);if(v>40&&v<180)W[k]=v;const b=Number(w.bodyFat);if(b>5&&b<45)BF[k]=b}
 IFOOD={};for(const w of RAW.wellness){const k=String(w.id||w.date||'').slice(0,10);const kcal=Number(w.kcalConsumed);
  if(DATE_RE.test(k)&&kcal>0)IFOOD[k]={kcal,carb:Number(w.carbohydrates)||0,protein:Number(w.protein)||0,fat:Number(w.fatTotal)||0,samples:HEALTH[k]?HEALTH[k].samples:null,meals:[],src:'intervals'}}
 FOOD=Object.assign({},HIST,HEALTH,IFOOD);
 const withFtp=RAW.completed.filter(a=>Number(a.icu_ftp)>0).sort((a,b)=>String(a.start_date_local).localeCompare(String(b.start_date_local)));
 if(withFtp.length)FTP=Number(withFtp[withFtp.length-1].icu_ftp);
 const wk=Object.keys(W).sort();WOUT={};
 for(const k of wk){const near=wk.filter(x=>x!==k&&Math.abs(diffDays(x,k))<=7).map(x=>W[x]).sort((a,b)=>a-b);if(near.length>=3){const m=near[Math.floor(near.length/2)];if(Math.abs(W[k]-m)>1.0)WOUT[k]=true}}
 TKEYS=wk.filter(k=>!WOUT[k]);TREND={};let t=null,last=null;
 for(const k of TKEYS){if(t==null)t=W[k];else{const gap=Math.max(1,diffDays(k,last));const a=1-Math.pow(1-.12,gap);t=t+a*(W[k]-t)}TREND[k]=t;last=k}
 CACHE.clear();
}
function trendAt(k){let v=null;for(const x of TKEYS){if(x<=k)v=TREND[x];else break}return v}
function weightKg(){
 const v=TKEYS.length?TREND[TKEYS[TKEYS.length-1]]:null;if(v)return v;
 const a=RAW.completed.filter(x=>Number(x.icu_weight)>40).sort((p,q)=>String(q.start_date_local).localeCompare(String(p.start_date_local)))[0];
 return a?Number(a.icu_weight):82;
}
function bodyFat(){const ks=Object.keys(BF).filter(k=>diffDays(TODAY,k)<=21&&diffDays(TODAY,k)>=0);return ks.length>=3?mean(ks.map(k=>BF[k])):SET.bfDefault}
const ffmKg=()=>weightKg()*(1-bodyFat()/100);

/* ============ sessions ============ */
const RIDE_RE=/^(Ride|VirtualRide|GravelRide|MountainBikeRide|EBikeRide)$/i;
const isRideT=t=>RIDE_RE.test(t||'');
const isStrengthEv=e=>!isRideT(e.type)&&(e.type==='WeightTraining'||/strength|gym|resistance/i.test(e.name||''));
function zonesP(e){const zt=e.workout_doc&&e.workout_doc.zoneTimes;if(!Array.isArray(zt))return null;const a=Array(7).fill(0);let any=false;for(const z of zt){const i=Number(z.zone);if(i>=1&&i<=7){a[i-1]+=Number(z.secs)||0;any=true}}return any?a:null}
function zonesA(e){const zt=e.icu_zone_times;if(!Array.isArray(zt))return null;const a=Array(7).fill(0);let any=false;for(const z of zt){const m=/^Z([1-7])$/.exec(z.id||'');if(m){a[+m[1]-1]+=Number(z.secs)||0;any=true}}return any?a:null}
function rideFrom(e,done){
 if(done){const ing=e.carbs_ingested;return{kind:'ride',done:true,name:e.name||'Ride',mins:(+e.moving_time||0)/60,kj:(+e.icu_joules||0)/1000,zones:zonesA(e),load:+e.icu_training_load||0,IF:(+e.icu_intensity||0)/100,carbsIn:ing!=null&&ing!==''&&isFinite(+ing)?+ing:null,carbsUsed:isFinite(+e.carbs_used)?+e.carbs_used:null,start:e.start_date_local}}
 const doc=e.workout_doc||{},secs=+(doc.duration||e.moving_time||e.time_target)||0,watts=+doc.average_watts||0,j=+e.joules||(secs&&watts?secs*watts:0);
 return{kind:'ride',done:false,name:e.name||'Ride',mins:secs/60,kj:j/1000,zones:zonesP(e),load:+e.icu_training_load||0,IF:(+e.icu_intensity||0)/100,carbsIn:null,carbsUsed:null,start:e.start_date_local}
}
function strFrom(e,done){return{kind:'strength',done,name:e.name||'Strength',mins:((+e.moving_time)||1800)/60}}
function sessionsFor(date){
 const done=CB[date]||[],plan=PB[date]||[],out=[];
 const dR=done.filter(a=>isRideT(a.type)),dS=done.filter(isStrengthEv);
 dR.forEach(a=>out.push(rideFrom(a,true)));dS.forEach(a=>out.push(strFrom(a,true)));
 const pR=plan.filter(e=>isRideT(e.type)),pS=plan.filter(isStrengthEv);
 let missed=false;
 if(date>=TODAY){if(!dR.length)pR.forEach(e=>out.push(rideFrom(e,false)));if(!dS.length)pS.forEach(e=>out.push(strFrom(e,false)))}
 else if(pR.length&&!dR.length)missed=true;
 return{sessions:out,missed,rest:plan.some(e=>/rest day/i.test(e.name||'')),known:plan.length>0||done.length>0};
}
function intensityOf(s){
 const z=s.zones;
 if(z){const hi=(z[3]+z[4]+z[5]+z[6])/60,z3=z[2]/60;return hi>=10?'key':(z3>=20||(hi>=3&&z3>=10))?'moderate':'easy'}
 if(s.IF>0)return s.IF>=.85?'key':s.IF>=.72?'moderate':'easy';
 const n=s.name||'';return /threshold|ftp|vo2|interval|seiler/i.test(n)?'key':/tempo|sweet/i.test(n)?'moderate':'easy';
}
const TAB={easy:[[0,3.0],[45,3.5],[150,5.5],[180,6.0],[240,6.5]],moderate:[[0,4.0],[60,4.5],[150,5.5],[180,6.0],[240,6.5]],key:[[0,4.5],[60,5.0],[150,6.0],[240,6.5]]};
const lookup=(t,m)=>{if(!SET.smooth){let v=t[0][1];for(const [a,x] of t)if(m>=a)v=x;return v}if(m<=t[0][0])return t[0][1];for(let i=1;i<t.length;i++){if(m<=t[i][0]){const [a,x]=t[i-1],[b,y]=t[i];return x+(y-x)*(m-a)/(b-a)}}return t[t.length-1][1]};
function fuelFor(r){const m=Math.round(r.mins),i=r.int;if(m>=150)return{g:(m>=180||i==='key')?75:60,lo:60,hi:90};if(m>=60)return i==='easy'?{g:20,lo:0,hi:40}:{g:45,lo:30,hi:60};if(m>=45&&i==='key')return{g:30,lo:20,hi:45};return{g:0,lo:0,hi:0}}
const RANK={rest:0,light:1,easy:2,moderate:3,key:4,long:5};
function core(date){return coreFrom(date,false)}
function plannedCore(date){return coreFrom(date,true)}
function plannedSessions(date){
 const plan=PB[date]||[],out=[];
 plan.filter(e=>isRideT(e.type)).forEach(e=>out.push(rideFrom(e,false)));
 plan.filter(isStrengthEv).forEach(e=>out.push(strFrom(e,false)));
 return{sessions:out,missed:false,rest:plan.some(e=>/rest day/i.test(e.name||'')),known:plan.length>0};
}
function coreFrom(date,planOnly){
 const ck=planOnly?'P'+date:date;
 if(CACHE.has(ck))return CACHE.get(ck);
 const sf=planOnly?plannedSessions(date):sessionsFor(date),rides=sf.sessions.filter(s=>s.kind==='ride'),strs=sf.sessions.filter(s=>s.kind==='strength');
 const ge=clamp(SET.ge,20,26)/100;let gross=0,hours=0,kj=0,noPower=false,carbKg=null,tier='rest',fuelG=0,maxMins=0;
 for(const r of rides){
  r.int=intensityOf(r);hours+=r.mins/60;kj+=r.kj;maxMins=Math.max(maxMins,Math.round(r.mins));
  if(r.kj>0)gross+=r.kj/4.184/ge;else noPower=true;
  const tabKg=lookup(TAB[r.int],Math.round(r.mins));carbKg=carbKg==null?tabKg:Math.max(carbKg,tabKg);
  r.fuel=fuelFor(r);fuelG+=r.done&&r.carbsIn!=null?r.carbsIn:r.fuel.g*r.mins/60;
  const rt=Math.round(r.mins)>=150?'long':r.int==='key'?'key':r.int==='moderate'?'moderate':r.mins>=20?'easy':'light';
  if(RANK[rt]>RANK[tier])tier=rt;
 }
 if(strs.length){if(carbKg==null)carbKg=3.0;if(RANK.light>RANK[tier])tier='light'}
 const cyc=Math.max(0,gross-SET.resting*hours/24);
 const str=strs.reduce((s,x)=>s+SET.strength*clamp(x.mins/30,.3,1.5),0);
 const names=sf.sessions.map(s=>s.name);
 const label=names.length?names.join(' + '):sf.rest?'Rest day':sf.known?'No session':'No calendar event';
 const c={date,sessions:sf.sessions,rides,strs,missed:sf.missed,known:sf.known,label,hours,kj,noPower,cyc,str,exercise:cyc+str,carbKg,tier,fuelG,maxMins,
  fuelGph:hours>0?fuelG/hours:0,pending:sf.sessions.some(s=>!s.done)};
 CACHE.set(ck,c);return c;
}
const capFor=t=>t==='rest'?SET.capRest:(t==='light'||t==='easy')?SET.capEasy:t==='moderate'?SET.capMod:SET.capKey;

/* ============ planning engine ============ */
function baseDay(date,planOnly){
 const c=planOnly?plannedCore(date):core(date),p=core(addDays(date,-1)),n=core(addDays(date,1)),w=weightKg(),ffm=ffmKg();
 let kg=c.carbKg,adds=0;const why=[];
 const lowDay=c.tier==='rest'||c.tier==='light'||c.tier==='easy';
 const prevBig=p.tier==='long'||(p.tier==='key'&&p.maxMins>=90);
 const nextBig=n.tier==='long'||n.tier==='key';
 if(kg==null||c.tier==='rest'){kg=SET.restCarb}
 if(lowDay&&prevBig){adds+=SET.recAdd;why.push('recovery +'+SET.recAdd+' g/kg ('+(p.tier==='long'?'long ride':'hard session')+' yesterday)')}

function foodFlag(k){

}
const FLAGTXT={missing:'not logged',excluded:'excluded by you',low:'under 1,200 kcal: likely incomplete',high:'over 6,500 kcal: check entry',thin:'very few entries: likely incomplete',meals:'no lunch/dinner in log'};

/* ============ calibration ============ */
function calib(){
 const end=addDays(TODAY,-1),N=28,start=addDays(end,-(N-1)),ks=[];for(let i=0;i<N;i++)ks.push(addDays(start,i));
 const pts=[];ks.forEach((k,i)=>{if(W[k]!=null&&!WOUT[k])pts.push([i,W[k]])});
 const valid=ks.filter(k=>foodFlag(k)==='ok');
 let slope=null,se=null;
 if(pts.length>=8&&pts[pts.length-1][0]-pts[0][0]>=14){
  const mx=mean(pts.map(p=>p[0])),my=mean(pts.map(p=>p[1]));const sxx=pts.reduce((s,p)=>s+(p[0]-mx)**2,0);
  slope=pts.reduce((s,p)=>s+(p[0]-mx)*(p[1]-my),0)/sxx;
  const rss=pts.reduce((s,p)=>s+(p[1]-(my+slope*(p[0]-mx)))**2,0);se=Math.sqrt(rss/Math.max(1,pts.length-2)/sxx);
 }
 const avgIn=valid.length?mean(valid.map(k=>FOOD[k].kcal)):null;
 const modelAvg=mean(ks.map(k=>SET.baseline+core(k).exercise));
 const ready=slope!=null&&valid.length>=10;
 const maint=ready?avgIn-slope*7700:null,seK=se!=null?se*7700:null;
 return{ks,pts:pts.length,valid:valid.length,slope,se,avgIn,modelAvg,ready,maint,seK,suggest:ready?maint-modelAvg:null,
  conf:!ready?'not ready':seK*2<=150?'good':seK*2<=300?'fair':'low'};
}

/* ============ TREND ============ */
function weightChart(){
 const NDAYS=56,start=addDays(TODAY,-(NDAYS-1)),days=[];for(let i=0;i<NDAYS;i++)days.push(addDays(start,i));
 const pts=[],tr=[];days.forEach((k,i)=>{if(W[k]!=null)pts.push([i,W[k]]);const t=trendAt(k);if(t!=null)tr.push([i,t])});
 if(pts.length<2)return'<p class="note">Not enough weights to chart.</p>';
 const ys=pts.map(p=>p[1]).concat(tr.map(p=>p[1]));let lo=Math.floor((Math.min(...ys)-.2)*2)/2,hi=Math.ceil((Math.max(...ys)+.2)*2)/2;
 const w=640,h=220,L=42,R=10,T=10,B=24,X=i=>L+i/(NDAYS-1)*(w-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(h-T-B);
 let s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Weight and trend">';
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;s+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#2a4054"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v.toFixed(1)+'</text>'}
 for(let i=0;i<NDAYS;i+=14)s+='<text x="'+X(i)+'" y="'+(h-6)+'" text-anchor="middle">'+days[i].slice(5)+'</text>';
 s+='<polyline fill="none" stroke="#40b8a0" stroke-width="2.5" points="'+tr.map(p=>X(p[0])+','+Y(p[1])).join(' ')+'"/>';
 s+=pts.map(p=>WOUT[days[p[0]]]?'<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3.5" fill="none" stroke="#8595a5" stroke-width="1.5"/>':'<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3" fill="#6fb3ff" opacity=".85"/>').join('');
 return s+'</svg><p class="note">Blue dots are daily weigh-ins; the teal line is a smoothed trend. Day-to-day swings of 0.5–1 kg are normal when carbohydrate intake moves between rest and long-ride days (glycogen binds water), so judge the line, not the dots. A hollow grey ring is a reading more than 1 kg away from the median of the surrounding two weeks; the trend and slope ignore it.</p>';
}
function intakeChart(){
 const NDAYS=28,start=addDays(TODAY,-NDAYS),days=[];for(let i=0;i<NDAYS;i++)days.push(addDays(start,i));
 const vals=days.map(k=>FOOD[k]?FOOD[k].kcal:null),model=days.map(k=>SET.baseline+SET.offset+core(k).exercise);
 const mx=Math.max(3500,...vals.filter(v=>v!=null),...model)*1.05;
 const w=640,h=220,L=42,R=10,T=10,B=24,bw=(w-L-R)/NDAYS,Y=v=>T+(1-v/mx)*(h-T-B);
 let s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Logged intake and modelled maintenance">';
 for(let i=0;i<=4;i++){const v=mx*i/4;s+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#2a4054"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+N0(v)+'</text>'}
 days.forEach((k,i)=>{if(vals[i]==null)return;const f=foodFlag(k)==='ok';s+='<rect x="'+(L+i*bw+1)+'" y="'+Y(vals[i])+'" width="'+(bw-2)+'" height="'+(Y(0)-Y(vals[i]))+'" fill="'+(f?'#40b8a0':'none')+'" stroke="'+(f?'none':'#8595a5')+'" opacity="'+(f?.8:1)+'"/>'});
 s+='<polyline fill="none" stroke="#f3c36d" stroke-width="2" points="'+model.map((v,i)=>(L+i*bw+bw/2)+','+Y(v)).join(' ')+'"/>';
 for(let i=0;i<NDAYS;i+=7)s+='<text x="'+(L+i*bw+bw/2)+'" y="'+(h-6)+'" text-anchor="middle">'+days[i].slice(5)+'</text>';
 return s+'</svg><p class="note">Teal bars: logged days that look complete. Outlined grey: logged but flagged. Amber line: modelled maintenance from your baseline, offset and recorded rides.</p>';
}

  +'<div class="m"><small>28-day slope</small><b>'+(wk!=null?SG(wk,2)+' kg/wk':'—')+'</b><small>'+(cal.se!=null?'± '+N2(cal.se*7*2)+' (95%)':'needs ≥8 weigh-ins over ≥14 days')+' · '+cal.pts+' weigh-ins</small></div>'

 if(cal.ready)h+='<p class="'+(cal.conf==='low'?'warn':'good')+'">'+(cal.conf==='low'?'Low confidence: the weight line is too noisy for the offset to be trusted yet. ':'')+'If you apply it, targets move by '+SG(cal.suggest-SET.offset)+' kcal/day.</p><button class="btn" id="applyOff" style="max-width:280px">Apply suggested offset</button>';
 h+='<p class="note">Caveats: the 7,700 kcal/kg conversion is an approximation; a 1 kg swing from glycogen and water is 7,700 kcal on paper but is not fat. A short window with few weigh-ins can be badly wrong, which is why this refuses to show a result until the minimums are met.</p></section>';

  +ks.map(k=>{const f=FOOD[k],fl=foodFlag(k);return'<tr><td>'+k+'</td><td>'+(W[k]!=null?N1(W[k])+' kg':'—')+'</td><td>'+(f?N0(f.kcal):'—')+'</td><td>'+(f?f.src:'—')+'</td><td>'+(fl==='ok'?'ok':esc(FLAGTXT[fl]||fl))+'</td><td><input type="checkbox" data-ex="'+k+'" '+(EXCL[k]?'checked':'')+' '+(f?'':'disabled')+' style="width:auto"></td></tr>'}).join('')
  +'</tbody></table></div></details></section>';
 $('p-trend').innerHTML=h;
 const b=$('applyOff');if(b)b.addEventListener('click',()=>{setSetting('offset',clamp(Math.round(cal.suggest/5)*5,-500,800));renderAll()});
 $('p-trend').querySelectorAll('[data-ex]').forEach(x=>x.addEventListener('change',()=>{if(x.checked)EXCL[x.dataset.ex]=true;else delete EXCL[x.dataset.ex];try{localStorage.setItem(EKEY,JSON.stringify(EXCL))}catch(e){}renderAll()}));
